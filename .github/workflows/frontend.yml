name: Frontend
on:
  push:
    paths: ["apps/percolume/frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["apps/percolume/frontend/**", ".github/workflows/frontend.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/percolume/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/percolume/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
