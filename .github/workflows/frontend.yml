name: Frontend
on:
  push:
    paths: ["apps/percolume/frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["apps/percolume/frontend/**", ".github/workflows/frontend.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/percolume/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/percolume/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
  windows-package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/percolume/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/percolume/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: percolume-windows-installer
          path: apps/percolume/frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
